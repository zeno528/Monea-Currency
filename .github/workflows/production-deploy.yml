name: Deploy Production

on:
  push:
    branches:
      - main

# main 连续推送时只保留最新一次部署，避免旧提交晚于新提交完成。
concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Prepare deployment message
        shell: bash
        run: |
          subject=$(git log -1 --pretty=%s)
          echo "DEPLOY_MESSAGE=${GITHUB_SHA::7} · $subject" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "$DEPLOY_MESSAGE" --tag "$GITHUB_SHA"
