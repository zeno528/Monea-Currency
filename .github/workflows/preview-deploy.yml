# 分支预览部署
#
# 触发：推送到任意「非 main」分支时运行。
# 行为：使用 wrangler deploy 直接部署到 Cloudflare Workers；
#       部署 message 带上本次 git 提交信息（commit subject）。
#
# 前置：在仓库 Settings → Secrets and variables → Actions 配置：
#   - CLOUDFLARE_API_TOKEN   具备 Workers Scripts:Edit 权限的 API Token
#   - CLOUDFLARE_ACCOUNT_ID  账户 ID（dashboard 右侧可查）
name: Preview Deploy

on:
  push:
    branches-ignore:
      - main

# 同一分支并发推送时，取消旧的一次，只部署最新提交
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # 与 pnpm-lock.yaml 的 lockfileVersion 9.0 匹配，保证 --frozen-lockfile 通过
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Prepare deployment message
        shell: bash
        run: echo "DEPLOY_MESSAGE=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --message "$DEPLOY_MESSAGE"

      - name: Write job summary
        if: always()
        run: |
          {
            echo "### 🚀 预览分支已部署到 Cloudflare"
            echo ""
            echo "- **分支**: \`${GITHUB_REF_NAME}\`"
            echo "- **Commit**: ${DEPLOY_MESSAGE:-（无）}"
          } >> "$GITHUB_STEP_SUMMARY"
