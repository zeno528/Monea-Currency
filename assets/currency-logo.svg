<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Currency Worker — FX rate mark</title>
  <desc id="desc">A bold blue foreign-exchange rate curve with dollar and yen endpoints.</desc>
  <defs>
    <linearGradient id="bg" x1="130" y1="64" x2="880" y2="962" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2187ED"/>
      <stop offset="1" stop-color="#0047AE"/>
    </linearGradient>
    <linearGradient id="curve" x1="186" y1="754" x2="830" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CBEAFF"/>
      <stop offset=".48" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8EEFF"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#00357F" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <circle cx="278" cy="172" r="370" fill="#FFFFFF" fill-opacity=".055"/>
  <path d="M198 753C286 743 319 522 442 552 560 581 563 680 672 531 746 429 771 344 833 263" fill="none" stroke="#003F9A" stroke-opacity=".21" stroke-width="92" stroke-linecap="round"/>
  <path d="M198 753C286 743 319 522 442 552 560 581 563 680 672 531 746 429 771 344 833 263" fill="none" stroke="url(#curve)" stroke-width="43" stroke-linecap="round"/>
  <g fill="#FFFFFF" stroke="#0D66C8" stroke-width="16" filter="url(#shadow)">
    <circle cx="198" cy="753" r="108"/>
    <circle cx="833" cy="263" r="108"/>
  </g>
  <g fill="#0A61BF" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle">
    <text x="198" y="810" font-size="182">$</text>
    <text x="833" y="320" font-size="156">¥</text>
  </g>
  <g fill="#FFFFFF" stroke="#74B7F4" stroke-width="11">
    <circle cx="442" cy="552" r="22"/>
    <circle cx="672" cy="531" r="22"/>
  </g>
</svg>
